[package]
name = "zeroclaw-spaces"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Git-backed, offline-first document spaces: client commits, lossless merges, safe working-tree writes."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["sync"] }

[dev-dependencies]
tempfile = "3.26"
